name: Relatório Diário de Licitações

on:
  schedule:
    # Roda às 09:00 da manhã (12:00 UTC) e às 20:20 da noite (23:20 UTC) no horário de Brasília
    - cron: '0 12 * * *'
    - cron: '20 23 * * *'
  workflow_dispatch: # Permite testar manualmente a qualquer momento

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Executar o Script
        run: python bot.py
